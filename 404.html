<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffffff">
    <title>Pagina niet gevonden · Vermaire Hoveniers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #0d2818;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 70%, rgba(45, 138, 78, 0.07), transparent 55%);
        }
        .wrap { text-align: center; max-width: 480px; }
        .logo { width: 220px; height: auto; margin-bottom: 2.5rem; }
        .code {
            font-family: 'Exo 2', sans-serif;
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: #2d8a4e;
        }
        h1 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0.75rem 0 0.5rem;
        }
        p { color: #5a6b5f; line-height: 1.6; margin-bottom: 2rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 1.6rem;
            background: #2d8a4e;
            color: #ffffff;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        .btn:hover { background: #1f5e3d; transform: translateY(-1px); }
        .links { margin-top: 1.25rem; display: flex; gap: 1.25rem; justify-content: center; }
        .links a { color: #2d8a4e; font-size: 0.85rem; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/assets/logo.png" alt="Vermaire Hoveniers" class="logo">
        <div class="code">404</div>
        <h1>Deze pagina bestaat niet</h1>
        <p>Het lijkt erop dat u een pad bent ingeslagen dat wij nog niet hebben aangelegd.</p>
        <a href="/" class="btn">Terug naar de homepage</a>
        <div class="links">
            <a href="/projecten">Projecten</a>
            <a href="/#diensten">Diensten</a>
            <a href="/#contact">Contact</a>
        </div>
    </div>
</body>
</html>
